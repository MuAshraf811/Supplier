name: e_printer
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.0
  firebase_storage: ^12.3.6
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6

  flutter_pdfview: ^1.3.4
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.12
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  lottie: ^3.1.3
  shared_preferences: ^2.3.3
  smooth_page_indicator: ^1.2.0+3
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  generate: true

  assets:
    - assets/svgs/
    - assets/images/
    - assets/images/Digital/
    - assets/images/Gift Items/
    - assets/images/Packaging/
    - assets/images/printing/
    - assets/images/Signage/
    - assets/images/Unifoarm/
    - assets/jsons/Supplier Logo Final333-01.json

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/quick_sand/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/quick_sand/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/quick_sand/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/quick_sand/Quicksand-Bold.ttf
          weight: 700

    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
flutter_intl:
  enabled: true
